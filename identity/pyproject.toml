[project]
name = "identity"
version = "0.1.0"
description = "Sign-up, login, and JWT issuance for Finance Tracker"
readme = "README.md"
authors = [
    { name = "Leonardo Alves", email = "55108062+LeoAlvesBahia@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
pythonpath = ["."]
