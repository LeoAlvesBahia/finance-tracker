services:
  postgres:
    image: postgres:18-trixie
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: identity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  identity:
    build: ./identity
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://identity:identity@postgres:5432/identity
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: