name: identity CI

on:
  pull_request:
    paths:
      - "identity/**"
  push:
    branches:
      - main
    paths:
      - "identity/**"

defaults:
  run:
    working-directory: identity

jobs:
  check:
    name: lint, type-check, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.24"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest

      - name: Build Docker image
        run: docker build -t identity .
